<p-card>
  <div class="toolbar">
    <h2>Products</h2>
    <input type="text" pInputText placeholder="Search" (input)="dt.filterGlobal($any($event.target).value, 'contains')" class="search-input" />
    <p-button *appHasRight="RightCode.ProductsCreate" label="Add Product" icon="pi pi-plus" (onClick)="createProduct()" />
  </div>

  <p-table
    #dt
    [value]="products()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['sku', 'name', 'productCategoryName', 'baseUnitOfMeasureCode']"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="sku">SKU <p-sortIcon field="sku" /></th>
        <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
        <th pSortableColumn="productCategoryName">Category <p-sortIcon field="productCategoryName" /></th>
        <th pSortableColumn="baseUnitOfMeasureCode">Base UOM <p-sortIcon field="baseUnitOfMeasureCode" /></th>
        <th>Variants</th>
        <th pSortableColumn="isActive">Status <p-sortIcon field="isActive" /></th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.sku }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.productCategoryName ?? '—' }}</td>
        <td>{{ product.baseUnitOfMeasureCode }}</td>
        <td>{{ product.hasVariants ? product.variants.length : '—' }}</td>
        <td>
          <p-tag [value]="product.isActive ? 'Active' : 'Inactive'" [severity]="product.isActive ? 'success' : 'danger'" />
        </td>
        <td class="actions">
          <p-button *appHasRight="RightCode.ProductsEdit" icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" pTooltip="Edit" (onClick)="editProduct(product)" />
          <p-button
            *appHasRight="RightCode.ProductsEdit"
            [icon]="product.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [text]="true"
            [rounded]="true"
            size="small"
            [pTooltip]="product.isActive ? 'Deactivate' : 'Activate'"
            (onClick)="toggleActive(product)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7">No products yet. Add a product to get started.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
