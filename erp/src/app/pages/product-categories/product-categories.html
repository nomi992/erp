<p-card>
  <div class="toolbar">
    <h2>Product Categories</h2>
    <input type="text" pInputText placeholder="Search" (input)="dt.filterGlobal($any($event.target).value, 'contains')" class="search-input" />
    <p-button *appHasRight="RightCode.ProductCategoriesCreate" label="Add Category" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </div>

  <p-table
    #dt
    [value]="categories()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['name', 'parentProductCategoryName']"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
        <th pSortableColumn="parentProductCategoryName">Parent <p-sortIcon field="parentProductCategoryName" /></th>
        <th pSortableColumn="isActive">Status <p-sortIcon field="isActive" /></th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-category>
      <tr>
        <td>{{ category.name }}</td>
        <td>{{ category.parentProductCategoryName ?? '—' }}</td>
        <td>
          <p-tag [value]="category.isActive ? 'Active' : 'Inactive'" [severity]="category.isActive ? 'success' : 'danger'" />
        </td>
        <td class="actions">
          <p-button *appHasRight="RightCode.ProductCategoriesEdit" icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" pTooltip="Edit" (onClick)="openEditDialog(category)" />
          <p-button
            *appHasRight="RightCode.ProductCategoriesEdit"
            [icon]="category.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [text]="true"
            [rounded]="true"
            size="small"
            [pTooltip]="category.isActive ? 'Deactivate' : 'Activate'"
            (onClick)="toggleActive(category)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No product categories yet. Add a category to get started.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingCategory() ? 'Edit Product Category' : 'Add Product Category'"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" pInputText formControlName="name" />
    </div>

    <div class="field">
      <label for="parentProductCategoryId">Parent Category</label>
      <p-select
        inputId="parentProductCategoryId"
        formControlName="parentProductCategoryId"
        [options]="parentOptions()"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="dialog-actions">
      <p-button label="Cancel" severity="secondary" [text]="true" type="button" (onClick)="closeDialog()" />
      <p-button label="Save" type="submit" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
