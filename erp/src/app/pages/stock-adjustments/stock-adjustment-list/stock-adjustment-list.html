<p-card>
  <div class="toolbar">
    <h2>Stock Adjustments</h2>
    <p-button *appHasRight="RightCode.StockAdjustmentsCreate" label="New Adjustment" icon="pi pi-plus" (onClick)="create()" />
  </div>

  <p-table
    [value]="adjustments()"
    [loading]="loading()"
    [lazy]="true"
    (onLazyLoad)="load($event)"
    [paginator]="true"
    [rows]="rows()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[25, 50, 100]"
    dataKey="id"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Adjustment No.</th>
        <th>Warehouse</th>
        <th>Reason</th>
        <th>Date</th>
        <th>Status</th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td><a class="link" (click)="view(item)">{{ item.adjustmentNo }}</a></td>
        <td>{{ item.warehouseName }}</td>
        <td>{{ item.reasonCode }}</td>
        <td>{{ item.date | date: 'mediumDate' }}</td>
        <td>
          <p-tag [value]="item.status" [severity]="statusSeverity(item.status)" />
        </td>
        <td class="actions">
          <p-button icon="pi pi-eye" [text]="true" [rounded]="true" size="small" pTooltip="View" (onClick)="view(item)" />
          @if (item.status === 'Draft') {
            <p-button *appHasRight="RightCode.StockAdjustmentsSubmit" icon="pi pi-send" [text]="true" [rounded]="true" size="small" pTooltip="Submit" (onClick)="submit(item)" />
          }
          @if (item.status === 'PendingApproval') {
            <p-button *appHasRight="RightCode.StockAdjustmentsApprove" icon="pi pi-check" [text]="true" [rounded]="true" size="small" severity="success" pTooltip="Approve" (onClick)="approve(item)" />
            <p-button *appHasRight="RightCode.StockAdjustmentsReject" icon="pi pi-times" [text]="true" [rounded]="true" size="small" severity="danger" pTooltip="Reject" (onClick)="reject(item)" />
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">No stock adjustments yet.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
