<p-card>
  <div class="toolbar">
    <h2>Units of Measure</h2>
    <p-button *appHasRight="RightCode.UnitsOfMeasureCreate" label="Add Unit" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </div>

  <p-table [value]="units()" [loading]="loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Status</th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-unit>
      <tr>
        <td>{{ unit.code }}</td>
        <td>{{ unit.name }}</td>
        <td>
          <p-tag [value]="unit.isActive ? 'Active' : 'Inactive'" [severity]="unit.isActive ? 'success' : 'danger'" />
        </td>
        <td class="actions">
          <p-button *appHasRight="RightCode.UnitsOfMeasureEdit" icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" pTooltip="Edit" (onClick)="openEditDialog(unit)" />
          <p-button
            *appHasRight="RightCode.UnitsOfMeasureEdit"
            [icon]="unit.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [text]="true"
            [rounded]="true"
            size="small"
            [pTooltip]="unit.isActive ? 'Deactivate' : 'Activate'"
            (onClick)="toggleActive(unit)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No units of measure yet. Add one to get started.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingUnit() ? 'Edit Unit of Measure' : 'Add Unit of Measure'"
  [modal]="true"
  [style]="{ width: '24rem' }"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <div class="field">
      <label for="code">Code</label>
      <input id="code" type="text" pInputText formControlName="code" />
    </div>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" pInputText formControlName="name" />
    </div>

    <div class="dialog-actions">
      <p-button label="Cancel" severity="secondary" [text]="true" type="button" (onClick)="closeDialog()" />
      <p-button label="Save" type="submit" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
