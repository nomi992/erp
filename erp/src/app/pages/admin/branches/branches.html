<p-card>
  <div class="toolbar">
    <h2>Branches</h2>
    <input type="text" pInputText placeholder="Search" (input)="dt.filterGlobal($any($event.target).value, 'contains')" class="search-input" />
    <p-button *appHasRight="RightCode.BranchesCreate" label="Add Branch" icon="pi pi-plus" (onClick)="openCreateDialog()" />
  </div>

  @if (isSystemAdmin()) {
    <div class="filter">
      <label for="tenantFilter">Tenant</label>
      <p-select
        inputId="tenantFilter"
        [ngModel]="tenantFilter()"
        (ngModelChange)="tenantFilter.set($event); onTenantFilterChange()"
        [options]="tenantOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="All tenants"
        [showClear]="true"
      />
    </div>
  }

  <p-table
    #dt
    [value]="branches()"
    [loading]="loading()"
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [globalFilterFields]="['tenantName', 'name', 'code']"
  >
    <ng-template pTemplate="header">
      <tr>
        @if (isSystemAdmin()) {
          <th pSortableColumn="tenantName">Tenant <p-sortIcon field="tenantName" /></th>
        }
        <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
        <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
        <th pSortableColumn="isActive">Status <p-sortIcon field="isActive" /></th>
        <th class="actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-branch>
      <tr>
        @if (isSystemAdmin()) {
          <td>{{ branch.tenantName }}</td>
        }
        <td>{{ branch.name }}</td>
        <td>{{ branch.code }}</td>
        <td>
          <p-tag [value]="branch.isActive ? 'Active' : 'Inactive'" [severity]="branch.isActive ? 'success' : 'danger'" />
        </td>
        <td class="actions">
          <p-button *appHasRight="RightCode.BranchesEdit" icon="pi pi-pencil" [text]="true" [rounded]="true" size="small" pTooltip="Edit" (onClick)="openEditDialog(branch)" />
          <p-button
            *appHasRight="RightCode.BranchesEdit"
            [icon]="branch.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [text]="true"
            [rounded]="true"
            size="small"
            [pTooltip]="branch.isActive ? 'Deactivate' : 'Activate'"
            (onClick)="toggleActive(branch)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="isSystemAdmin() ? 5 : 4">No branches yet. Add a branch to get started.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingBranch() ? 'Edit Branch' : 'Add Branch'"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="branch-form">
    @if (isSystemAdmin()) {
      <div class="field">
        <label for="tenantId">Tenant</label>
        <p-select
          inputId="tenantId"
          formControlName="tenantId"
          [options]="tenantOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a tenant"
        />
      </div>
    }

    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" pInputText formControlName="name" />
    </div>

    <div class="field">
      <label for="code">Code</label>
      <input id="code" type="text" pInputText formControlName="code" />
    </div>

    <div class="dialog-actions">
      <p-button label="Cancel" severity="secondary" [text]="true" type="button" (onClick)="closeDialog()" />
      <p-button label="Save" type="submit" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
